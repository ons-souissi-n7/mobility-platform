services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mobility_dev}
      POSTGRES_USER: ${POSTGRES_USER:-mobility}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mobility_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-mobility} -d ${POSTGRES_DB:-mobility_dev}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgresql://${POSTGRES_USER:-mobility}:${POSTGRES_PASSWORD:-mobility_secret}@db:5432/${POSTGRES_DB:-mobility_dev}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      DEBUG: "True"
      MOVEON_API_URL: http://fake-moveon-api:8080
      PEGASE_API_URL: http://fake-pegase-api:8181
      EUDONET_API_URL: http://fake-eudonet-api:8282
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_123}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      fake-moveon-api:
        condition: service_started
      fake-pegase-api:
        condition: service_started
      fake-eudonet-api:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=2)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgresql://${POSTGRES_USER:-mobility}:${POSTGRES_PASSWORD:-mobility_secret}@db:5432/${POSTGRES_DB:-mobility_dev}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      DEBUG: "True"
      MOVEON_API_URL: http://fake-moveon-api:8080
      PEGASE_API_URL: http://fake-pegase-api:8181
      EUDONET_API_URL: http://fake-eudonet-api:8282
      MOVEON_API_KEY: ${MOVEON_API_KEY:-}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_123}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
      fake-moveon-api:
        condition: service_started
      fake-pegase-api:
        condition: service_started
      fake-eudonet-api:
        condition: service_started
    command: python manage.py qcluster

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      API_INTERNAL_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    command: ["npm", "run", "dev", "--", "--webpack", "--hostname", "0.0.0.0"]
    depends_on:
      backend:
        condition: service_healthy

  fake-moveon-api:
    build:
      context: ./fake-moveon-api
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./fake-moveon-api:/app
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)\""
      ]
      interval: 10s
      timeout: 5s
      retries: 5

  fake-pegase-api:
    build:
      context: ./fake-pegase-api
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./fake-pegase-api:/app
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8181/health', timeout=2)\""
      ]
      interval: 10s
      timeout: 5s
      retries: 5

  fake-eudonet-api:
    build:
      context: ./fake-eudonet-api
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./fake-eudonet-api:/app
    ports:
      - "8282:8282"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8282/health', timeout=2)\""
      ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_123}
      # SSE-S3: 32-byte AES-256 key (base64). Override in production via env var.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-mobility-dev-key:bW9iaWxpdHktZGV2LWVuY3J5cHQta2V5LTMyYnl0ZXM=}
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9003"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
  minio_data:
