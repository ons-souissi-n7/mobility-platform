# Charge automatiquement les tableaux de bord JSON du dossier monitoring/grafana/dashboards/
apiVersion: 1

providers:
  - name: mobility-platform
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards/json
