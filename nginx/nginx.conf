worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Désactive la version de Nginx dans les en-têtes
    server_tokens off;

    # En-têtes de sécurité communs
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Serveur HTTP (port 80) ─────────────────────────────────────────────────
    # Redirige tout vers HTTPS, sauf le challenge ACME de Certbot.
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Serveur HTTPS (port 443) ───────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # Certificats Let's Encrypt (gérés par le service certbot)
        ssl_certificate     /etc/letsencrypt/live/mobility.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mobility.example.com/privkey.pem;

        # Protocoles et suites de chiffrement recommandés (Mozilla Modern)
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # HSTS : force HTTPS pour 1 an
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── API Django ──────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            client_max_body_size 20m;
        }

        # ── Fichiers statiques Django ───────────────────────────────────────────
        location /static/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ── Frontend Next.js ────────────────────────────────────────────────────
        location / {
            proxy_pass         http://frontend:3000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
