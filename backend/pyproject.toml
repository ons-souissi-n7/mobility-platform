[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "DJ"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["tests/*.py", "tests/**/*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.development"

[tool.coverage.run]
omit = [
  "manage.py",
  "*/asgi.py",
  "*/wsgi.py",
  "config/settings/production.py",
  "config/settings/staging.py",
  # Commandes d'administration ponctuelles (seed/purge/reset) — outils d'exploitation
  # vérifiés manuellement, non couverts par la suite unitaire (convention du projet).
  "*/management/commands/*.py",
]