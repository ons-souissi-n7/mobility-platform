# docker-compose.test.yml — Override pour les tests E2E Playwright
#
# Utilisation :
#   docker compose -f docker-compose.dev.yml -f docker-compose.test.yml up --build --exit-code-from playwright
#
# Ce fichier SURCHARGE docker-compose.dev.yml pour :
#   1. Remplacer les URLs "localhost" par des noms de services Docker internes
#      (le navigateur Playwright tourne DANS le réseau Docker)
#   2. Ajouter le service "playwright" qui lance les tests
#
# Flux CAS en réseau Docker interne :
#   browser → http://frontend:3000/login
#   → http://backend:8000/api/v1/auth/login/
#   → http://fake-cas:8380/cas/login  (CAS_SERVER_PUBLIC_URL)
#   → http://backend:8000/api/v1/auth/cas-callback/  (BACKEND_PUBLIC_URL)
#   → http://frontend:3000/auth/callback?token=JWT  (FRONTEND_PUBLIC_URL)

services:

  # ── Base de données dédiée aux tests E2E ────────────────────────────────
  # Séparée de "db" (données de dev) : sans ça, chaque run E2E créait/mutait
  # des dizaines d'enregistrements ("2025-ALERT-TESTxxxxx", etc.) directement
  # dans la base de dev, jusqu'à la rendre inutilisable. Pas de volume nommé
  # persistant : chaque run E2E repart d'une base vierge (migrate la recrée).
  db-test:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_DB: mobility_test
      POSTGRES_USER: ${POSTGRES_USER:-mobility}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mobility_secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mobility} -d mobility_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Backend : base de test dédiée + remplacer les URLs publiques ────────
  backend:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mobility}:${POSTGRES_PASSWORD:-mobility_secret}@db-test:5432/mobility_test
      # CAS : le navigateur Playwright suit les redirections dans le réseau Docker
      CAS_SERVER_PUBLIC_URL: http://fake-cas:8380
      # Callback CAS → backend interne
      BACKEND_PUBLIC_URL: http://backend:8000
      # Redirection post-auth → frontend interne
      FRONTEND_PUBLIC_URL: http://frontend:3000
      # La suite E2E s'authentifie UNE SEULE FOIS (global-setup.ts, storageState
      # réutilisé par tous les tests) et tourne en un seul worker séquentiel
      # (playwright.config.ts) : la suite complète dure ~17 min, largement plus
      # que les 15 min par défaut de JWT_EXPIRY_MINUTES. Sans cette surcharge,
      # les derniers tests de la suite échouent en cascade (redirection vers
      # /login) simplement parce que le token s'est expiré en cours de run —
      # jamais un vrai bug applicatif. Ne s'applique qu'à cet environnement de
      # test : la valeur de production (15 min, .env) n'est pas modifiée.
      JWT_EXPIRY_MINUTES: "60"
      # `runserver` (dev server) spawns a new thread per browser keep-alive
      # connection, and each thread holds its own DB connection open for
      # conn_max_age (600s in base.py). Under an E2E run's concurrent SSR +
      # polling traffic, that many long-lived connections blow through
      # Postgres' default max_connections (100) — requests then fail with
      # "sorry, too many clients already", surfacing as random timeouts/500s
      # across unrelated pages. Closing the connection after each request
      # (test DB only — dev/prod keep conn_max_age=600) avoids the buildup.
      CONN_MAX_AGE: "0"
    depends_on:
      db-test:
        condition: service_healthy
    # db-test repart d'une base vierge à chaque run (pas de volume persistant,
    # cf. plus haut) : contrairement à docker-compose.dev.yml, les référentiels
    # et les données de démo (pays/départements/niveaux/parcours/universités/
    # catégories/accords/année 2025-2026/55 étudiants dont le compte E2E
    # etudiant@etud.n7.fr — ine 203EA05FISA, cf. STUDENT_DATA_2526 dans
    # seed_dev_data.py) ne sont donc jamais chargés — README.md documente ce
    # loaddata + seed_dev_data comme des étapes manuelles "premier démarrage"
    # qui supposent une base persistante. Sans elles, tout test s'appuyant
    # dessus échoue (countries/universities vides, étudiant introuvable...).
    # On les rejoue ici avant chaque run.
    #
    # reset_fixture_sequences (commande custom, cf. son docstring) : loaddata
    # insère ces fixtures avec des PK explicites, ce qui ne fait PAS avancer
    # les séquences Postgres — sans ce reset, le premier accord/année créé
    # ensuite par seed_dev_data ou par un test E2E (via l'UI ou l'API) retente
    # la PK 1 et lève une IntegrityError. `sqlsequencereset | psql` ferait la
    # même chose mais psql n'est pas installé dans cette image.
    command: >
      sh -c "python manage.py migrate &&
             python manage.py loaddata app/reference/fixtures/countries.json app/reference/fixtures/departments.json app/reference/fixtures/levels.json app/reference/fixtures/parcours.json app/institutions/fixtures/universities.json app/mobility/fixtures/mobility_categories.json app/mobility/fixtures/agreements.json app/mobility/fixtures/agreement_departments.json app/academic/fixtures/academic_years.json &&
             python manage.py reset_fixture_sequences reference institutions mobility academic &&
             python manage.py seed_dev_data &&
             python manage.py seed_test_accounts_2627 &&
             python manage.py runserver 0.0.0.0:8000"

  worker:
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mobility}:${POSTGRES_PASSWORD:-mobility_secret}@db-test:5432/mobility_test
      CONN_MAX_AGE: "0"
    depends_on:
      db-test:
        condition: service_healthy

  # ── Frontend : pointer l'API vers le backend interne ───────────────────
  frontend:
    environment:
      # Utilisé par le browser (client-side) — doit pointer vers le réseau Docker
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
      # Utilisé par Next.js server-side — reste interne
      API_INTERNAL_URL: http://backend:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # Volume .next dédié aux tests : évite les conflits de cache avec le dev stack
      - frontend_next_e2e:/app/.next

  # ── Runner Playwright headless (CI) ────────────────────────────────────
  # Usage : docker compose -f docker-compose.dev.yml -f docker-compose.test.yml \
  #           up --build --exit-code-from playwright
  playwright:
    # Pas de `profiles:` ici : ce service ne réserve aucun port hôte, il ne
    # peut donc entrer en conflit avec rien. C'est uniquement playwright-ui
    # et playwright-report (tous deux sur le port 9323) qui doivent être
    # empêchés de démarrer ensemble via un `up` sans nom de service explicite —
    # voir leurs blocs respectifs plus bas.
    build:
      context: .
      dockerfile: frontend/e2e/Dockerfile.playwright
    working_dir: /app
    volumes:
      - ./frontend/e2e:/app/e2e
      - ./frontend/playwright.config.ts:/app/playwright.config.ts
      - playwright_report:/app/playwright-report
      - playwright_test_results:/app/test-results
    environment:
      E2E_BASE_URL: http://frontend:3000
      E2E_API_URL: http://backend:8000/api/v1
      FORCE_COLOR: "1"
      CI: "true"
    depends_on:
      backend:
        condition: service_healthy
      fake-cas:
        condition: service_healthy
      frontend:
        condition: service_started
    command: >
      sh -c "
        echo '=== Attente du frontend ===' &&
        timeout 120 sh -c 'until wget -q --spider http://frontend:3000 > /dev/null 2>&1; do printf \".\"; sleep 3; done' &&
        echo '' &&
        echo '=== Frontend disponible. Lancement des tests ===' &&
        npx playwright test
      "

  # ── Interface graphique Playwright UI ──────────────────────────────────
  # Usage : docker compose -f docker-compose.dev.yml -f docker-compose.test.yml \
  #           up --build playwright-ui
  # Puis ouvrir http://localhost:9323 dans le navigateur
  # → Voir les tests, les exécuter un par un, observer les étapes + screenshots
  playwright-ui:
    profiles: ["e2e-ui"]
    build:
      context: .
      dockerfile: frontend/e2e/Dockerfile.playwright
    working_dir: /app
    ports:
      - "9323:9323"
    volumes:
      - ./frontend/e2e:/app/e2e
      - ./frontend/playwright.config.ts:/app/playwright.config.ts
      - playwright_report:/app/playwright-report
      - playwright_test_results:/app/test-results
    environment:
      E2E_BASE_URL: http://frontend:3000
      E2E_API_URL: http://backend:8000/api/v1
      FORCE_COLOR: "1"
      CI: "true"
    depends_on:
      backend:
        condition: service_healthy
      fake-cas:
        condition: service_healthy
      frontend:
        condition: service_started
    command: >
      sh -c "
        echo '=== Attente du frontend ===' &&
        timeout 120 sh -c 'until wget -q --spider http://frontend:3000 > /dev/null 2>&1; do printf \".\"; sleep 3; done' &&
        echo '' &&
        echo '=== UI Playwright disponible sur http://localhost:9323 ===' &&
        npx playwright test --ui --ui-host=0.0.0.0 --ui-port=9323
      "

  # ── Serveur de rapport HTML ─────────────────────────────────────────────
  # Usage : docker compose -f docker-compose.dev.yml -f docker-compose.test.yml \
  #           up playwright-report
  # Puis ouvrir http://localhost:9323 dans le navigateur
  # → Voir les résultats, les vidéos d'exécution, les traces pas à pas
  playwright-report:
    profiles: ["e2e-report"]
    build:
      context: .
      dockerfile: frontend/e2e/Dockerfile.playwright
    working_dir: /app
    ports:
      - "9323:9323"
    volumes:
      - playwright_report:/app/playwright-report
      - playwright_test_results:/app/test-results
    command: npx playwright show-report playwright-report --host 0.0.0.0 --port 9323

volumes:
  frontend_next_e2e:
  # Volumes nommés (plutôt que bind mounts vers l'hôte Windows) pour
  # playwright-report/ et test-results/ : les traces Playwright tournent avec
  # trace: "on" en CI (un trace.zip par test, pas seulement les échecs), et le
  # bind mount vers un chemin Windows fait perdre en route des chown/écritures
  # concurrentes (EACCES/ENOENT aléatoires sur les traces, cf. incident du
  # 2026-08-25). Un volume nommé vit entièrement dans la VM Linux de Docker
  # Desktop → permissions POSIX fiables. Le report reste consultable via le
  # service "playwright-report" (npx playwright show-report, port 9323).
  playwright_report:
  playwright_test_results:
