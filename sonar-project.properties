sonar.projectKey=Mobility-Platform
sonar.projectName=Mobility Platform
sonar.sources=backend,frontend
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/.next/**,**/venv/**,**/__pycache__/**,**/migrations/**,**/playwright-report/**,**/test-results/**

# Tests — exclus de sonar.sources pour ne pas être comptés comme code applicatif
# (couverture, duplication) tout en restant analysés pour leurs propres règles.
sonar.tests=backend,frontend
sonar.test.inclusions=**/tests/**,**/test_*.py,**/*.test.ts,**/*.test.tsx,**/__tests__/**,**/e2e/**
sonar.test.exclusions=**/node_modules/**,**/.next/**,**/venv/**,**/__pycache__/**

# Rapports de couverture — sans eux, SonarQube affiche 0% sur le code neuf
# même quand les suites de tests réelles ont une couverture correcte.
# Backend : généré par `pytest --cov=. --cov-report=xml` (backend/coverage.xml).
sonar.python.coverage.reportPaths=backend/coverage.xml
# Frontend : généré par `npm run test:coverage` (frontend/coverage/lcov.info).
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info